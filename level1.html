<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiny Quest - Level 1</title>

    <link rel="stylesheet" href="level1.css">
</head>

<body>

    <!-- GAME SCREEN -->
    <div id="game">

        <!-- =========================
             HUD
        ========================== -->
        <div class="hud">

            <!-- KAI STATUS -->
            <div class="player-hud">

                <div class="avatar">
                    <div class="kai-avatar"></div>
                </div>

                <div class="player-info">

                    <div class="name-row">
                        <span class="player-name">Kai</span>

                        <span class="level">
                            Lv. 1
                        </span>
                    </div>

                    <!-- HP -->
                    <div class="stat-row">

                        <span class="stat-icon hp-icon">♥</span>

                        <div class="stat-bar">
                            <div
                                id="hpBar"
                                class="hp-fill">
                            </div>
                        </div>

                        <span id="hpText">
                            100 / 100
                        </span>

                    </div>


                    <!-- MANA -->
                    <div class="stat-row">

                        <span class="stat-icon mana-icon">◆</span>

                        <div class="stat-bar">
                            <div
                                id="manaBar"
                                class="mana-fill">
                            </div>
                        </div>

                        <span id="manaText">
                            50 / 50
                        </span>

                    </div>

                </div>

            </div>


            <!-- GOLD -->
            <div class="gold-box">

                <span class="coin">
                    🪙
                </span>

                <div>
                    <small>GOLD</small>

                    <strong id="gold">
                        125
                    </strong>
                </div>

            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <div class="wasd">

                    <kbd>W</kbd>

                    <div>
                        <kbd>A</kbd>
                        <kbd>S</kbd>
                        <kbd>D</kbd>
                    </div>

                </div>

                <span>
                    Move
                </span>

                <kbd>E</kbd>

                <span>
                    Interact
                </span>

            </div>

        </div>


        <!-- =========================
             GAME WORLD
        ========================== -->
        <div id="world">

            <!-- VILLAGE MAP -->
            <div class="village-map"></div>


            <!-- FOREST SIGN -->
            <div
                id="forestExit"
                class="forest-sign">

                <span>
                    To Forest →
                </span>

            </div>


            <!-- KAI -->
            <div id="kai">

                <div class="kai-sprite"></div>

            </div>


            <!-- INTERACTION MESSAGE -->
            <div
                id="interaction"
                class="interaction">

                <span id="interactionText">
                    Use W A S D to move
                </span>

            </div>

        </div>


        <!-- =========================
             BOTTOM MESSAGE
        ========================== -->
        <div class="dialogue">

            <div class="dialogue-icon">
                💬
            </div>

            <div>

                <strong>
                    Kai
                </strong>

                <p id="dialogueText">
                    A peaceful village...
                    I should find the path to the forest.
                </p>

            </div>

        </div>


        <!-- =========================
             LOCATION
        ========================== -->
        <div class="location">
            Level 1 — Peaceful Village
        </div>

    </div>


    <script src="level1.js"></script>

</body>
</html>
